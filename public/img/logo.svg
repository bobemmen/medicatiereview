<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">

  <!-- AI tekst -->
  <text x="0" y="72" font-family="Arial, sans-serif" font-size="62" font-weight="900"
        fill="#1A3A7C" letter-spacing="-2">AI</text>

  <!-- Capsule (lichtblauw/donkerblauw, schuin ~135°) -->
  <g transform="translate(108,52) rotate(-40)">
    <!-- Lichtblauwe helft (boven) -->
    <path d="M-13,0 A13,13 0 0,1 13,0 L13,-30 A13,13 0 0,0 -13,-30 Z"
          fill="#4A90D9" rx="13"/>
    <rect x="-13" y="-30" width="26" height="30" fill="#4A90D9"/>
    <ellipse cx="0" cy="-30" rx="13" ry="13" fill="#4A90D9"/>
    <!-- Donkerblauwe helft (onder) -->
    <rect x="-13" y="0" width="26" height="30" fill="#1A4F9C"/>
    <ellipse cx="0" cy="30" rx="13" ry="13" fill="#1A4F9C"/>
  </g>

  <!-- Ronde tablet (donkerblauw met diagonale streep) -->
  <circle cx="142" cy="82" r="22" fill="#1A4F9C"/>
  <line x1="125" y1="96" x2="159" y2="68" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Woordmerk -->
  <text x="180" y="83" font-family="Arial, sans-serif" font-size="52" font-weight="700"
        fill="#1A2F6B" letter-spacing="-1">medicatiereview</text>
  <text x="463" y="83" font-family="Arial, sans-serif" font-size="52" font-weight="700"
        fill="#2563C4" letter-spacing="-1">.ai</text>
</svg>
